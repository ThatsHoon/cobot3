<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시스템 아키텍처</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:40px;min-height:100vh}
.wrap{max-width:1060px;margin:0 auto}
h1{color:#e8e8e8;font-size:20px;font-weight:600;margin-bottom:6px}
.sub{color:#888;font-size:12px;margin-bottom:28px}
.diagram{border:1px solid #333;border-radius:8px;padding:28px;background:#181818;overflow:hidden}
svg{display:block;width:100%}
.footer{color:#666;font-size:11px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<h1>시스템 아키텍처</h1>
<p class="sub">2-PC 구성 · Main(192.168.10.94) ↔ C2(192.168.10.105) · ROS2 Domain 130</p>
<div class="diagram">
<svg viewBox="0 0 1000 330" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bbb"/>
    </marker>
    <marker id="ah-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b8b8b8"/>
    </marker>
  </defs>

  <!-- Arrows (drawn before boxes for z-order) -->
  <!-- Arrow 1: Main → Bus (downlink, solid) -->
  <line x1="310" y1="164" x2="374" y2="164" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Arrow 2: Bus → Main (uplink, dashed) -->
  <line x1="374" y1="186" x2="310" y2="186" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-dash)"/>
  <!-- Arrow 3: Bus → C2 (downlink, solid) -->
  <line x1="626" y1="164" x2="689" y2="164" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- Arrow 4: C2 → Bus (uplink, dashed) -->
  <line x1="689" y1="186" x2="626" y2="186" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-dash)"/>

  <!-- Arrow labels — placed ABOVE arrows, clear of bus box (bus box top = y=145) -->
  <text x="342" y="138" fill="#999999" font-size="9" text-anchor="middle">영상·텔레메트리</text>
  <text x="342" y="204" fill="#888888" font-size="9" text-anchor="middle">cmd_vel·명령</text>

  <!-- LEFT BOX: Main PC -->
  <rect x="30" y="60" width="280" height="210" rx="4" fill="#2c2c2c" stroke="#999" stroke-width="1.5"/>
  <text x="170" y="92" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">Main PC</text>
  <text x="170" y="108" fill="#888888" font-size="10" text-anchor="middle">192.168.10.94</text>
  <line x1="50" y1="120" x2="290" y2="120" stroke="#555" stroke-width="1"/>
  <text x="170" y="140" fill="#c0c0c0" font-size="11" text-anchor="middle">Isaac Sim 5.1 + Go2 Unitree</text>
  <text x="170" y="158" fill="#c0c0c0" font-size="11" text-anchor="middle">OmniGraph · 7 cameras</text>
  <text x="170" y="176" fill="#c0c0c0" font-size="11" text-anchor="middle">video/depth degrade ×11</text>
  <text x="170" y="194" fill="#c0c0c0" font-size="11" text-anchor="middle">telemetry_bridge</text>
  <text x="170" y="212" fill="#c0c0c0" font-size="11" text-anchor="middle">Nav2 + nav2_patrol</text>

  <!-- CENTER BOX: ROS2 Bus -->
  <rect x="375" y="145" width="250" height="70" rx="4" fill="#222222" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="175" fill="#d0d0d0" font-size="12" font-weight="600" text-anchor="middle">ROS2 Domain 130</text>
  <text x="500" y="191" fill="#888888" font-size="9" text-anchor="middle">FastDDS UDP · 0.57 MB/s</text>

  <!-- RIGHT BOX: C2 PC -->
  <rect x="690" y="60" width="280" height="210" rx="4" fill="#2c2c2c" stroke="#999" stroke-width="1.5"/>
  <text x="830" y="92" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">C2 PC</text>
  <text x="830" y="108" fill="#888888" font-size="10" text-anchor="middle">192.168.10.105</text>
  <line x1="710" y1="120" x2="950" y2="120" stroke="#555" stroke-width="1"/>
  <text x="830" y="140" fill="#c0c0c0" font-size="11" text-anchor="middle">ros_bridge.py</text>
  <text x="830" y="158" fill="#c0c0c0" font-size="11" text-anchor="middle">FastAPI :8000 · Next.js :3000</text>
  <text x="830" y="176" fill="#c0c0c0" font-size="11" text-anchor="middle">YOLO v8 · PostgreSQL :5432</text>
  <text x="830" y="194" fill="#c0c0c0" font-size="11" text-anchor="middle">Foxglove Bridge :8765/:8767</text>
  <text x="830" y="212" fill="#c0c0c0" font-size="11" text-anchor="middle">nav2_patrol FSM</text>
</svg>
</div>
<p class="footer">cobot3 · 2-PC · ROS2 Humble · Isaac Sim 5.1</p>
</div>
</body>
</html>
