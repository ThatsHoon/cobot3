<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자율 순찰 FSM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:40px;min-height:100vh}
.wrap{max-width:1060px;margin:0 auto}
h1{color:#e8e8e8;font-size:20px;font-weight:600;margin-bottom:6px}
.sub{color:#888;font-size:12px;margin-bottom:28px}
.diagram{border:1px solid #333;border-radius:8px;padding:28px;background:#181818;overflow:hidden}
svg{display:block;width:100%}
.footer{color:#666;font-size:11px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<h1>자율 순찰 FSM</h1>
<p class="sub">nav2_patrol · IDLE / PATROL / HOME / PAUSED 상태 전이</p>
<div class="diagram">
<svg viewBox="0 0 1000 480" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bbb"/>
    </marker>
    <marker id="ah-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b8b8b8"/>
    </marker>
  </defs>

  <!-- Transitions (drawn before state boxes) -->

  <!-- 1. IDLE → PATROL (solid) -->
  <path d="M 590 100 C 660 100, 720 160, 720 208" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="670" y="145" fill="#b8b8b8" font-size="9" text-anchor="middle">sortie</text>

  <!-- 2. PATROL → PAUSED (stop) -->
  <path d="M 720 272 C 720 340, 630 380, 590 380" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="705" y="330" fill="#b8b8b8" font-size="9" text-anchor="middle">stop</text>

  <!-- 3. PATROL → HOME directly (dashed, auto arrival) -->
  <path d="M 630 224 C 560 200, 460 200, 370 224" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-dash)"/>
  <text x="500" y="196" fill="#888888" font-size="9" text-anchor="middle">도착 자동</text>

  <!-- 4. PAUSED → PATROL (solid) -->
  <path d="M 590 380 C 660 380, 720 320, 720 272" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="680" y="350" fill="#b8b8b8" font-size="9" text-anchor="middle">resume</text>

  <!-- 5. PAUSED → HOME (solid) -->
  <path d="M 410 380 C 340 380, 280 320, 280 272" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="320" y="350" fill="#b8b8b8" font-size="9" text-anchor="middle">home</text>

  <!-- 6. HOME → IDLE (dashed, auto arrival) -->
  <path d="M 280 208 C 280 140, 380 100, 410 100" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-dash)"/>
  <text x="320" y="145" fill="#888888" font-size="9" text-anchor="middle">도착 자동</text>

  <!-- State 1: IDLE -->
  <rect x="410" y="68" width="180" height="64" rx="4" fill="#383838" stroke="#999" stroke-width="1.5"/>
  <text x="500" y="96" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">IDLE</text>
  <text x="500" y="114" fill="#b8b8b8" font-size="10" text-anchor="middle">대기 / 초기 상태</text>

  <!-- State 2: PATROL -->
  <rect x="630" y="208" width="180" height="64" rx="4" fill="#383838" stroke="#999" stroke-width="1.5"/>
  <text x="720" y="236" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">PATROL</text>
  <text x="720" y="254" fill="#b8b8b8" font-size="10" text-anchor="middle">순찰 목표 이동</text>

  <!-- State 3: HOME -->
  <rect x="190" y="208" width="180" height="64" rx="4" fill="#2c2c2c" stroke="#999" stroke-width="1.5"/>
  <text x="280" y="236" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">HOME</text>
  <text x="280" y="254" fill="#b8b8b8" font-size="10" text-anchor="middle">기지 귀환</text>

  <!-- State 4: PAUSED -->
  <rect x="410" y="348" width="180" height="64" rx="4" fill="#2c2c2c" stroke="#999" stroke-width="1.5"/>
  <text x="500" y="376" fill="#e8e8e8" font-size="14" font-weight="700" text-anchor="middle">PAUSED</text>
  <text x="500" y="394" fill="#b8b8b8" font-size="10" text-anchor="middle">cmd_vel 정지</text>

  <!-- Legend -->
  <line x1="750" y1="428" x2="780" y2="428" stroke="#999" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="785" y="431" fill="#999999" font-size="9">명령 전이</text>
  <line x1="750" y1="444" x2="780" y2="444" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah-dash)"/>
  <text x="785" y="447" fill="#888888" font-size="9">자동 전이 (도착)</text>
</svg>
</div>
<p class="footer">cobot3 · Nav2 Humble · bt_navigator · ZoneRouter</p>
</div>
</body>
</html>
